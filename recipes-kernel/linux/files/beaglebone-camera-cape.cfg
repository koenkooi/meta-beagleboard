# BeagleBone camera capes (QuickLogic CSSP + Aptina MT9M114/MT9T112).
# MEDIA_SUPPORT=m and the DMA/EDMA/GPMC/I2C options come from multi_v7_defconfig;
# the helpers (aptina-pll, v4l2-cci, v4l2-fwnode, videobuf2-vmalloc) are selected
# by the drivers.
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_CAMERA_SENSOR=y
CONFIG_VIDEO_CSSP_CAMIF=m
CONFIG_VIDEO_MT9M114=m
CONFIG_VIDEO_MT9T112=m
