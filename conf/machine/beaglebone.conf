#@TYPE: Machine
#@NAME: BeagleBone machine
#@DESCRIPTION: Machine configuration for the http://beagleboard.org/bone board 

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = "xserver-xorg \
           xf86-input-evdev \
           xf86-video-modesetting \
           xf86-video-fbdev"

# Only has DVI connector for external screen
GUI_MACHINE_CLASS = "bigscreen"

require conf/machine/include/ti33x.inc

KBUILD_DEFCONFIG = "multi_v7_defconfig"
PREFERRED_PROVIDER_virtual/kernel = "linux-stable"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

KERNEL_DEVICETREE_PREFIX = ""
KERNEL_DEVICETREE = " \
    ti/omap/am335x-bone.dtb \
    ti/omap/am335x-boneblack.dtb \
    ti/omap/am335x-boneblack-wireless.dtb \
    ti/omap/am335x-boneblue.dtb \
    ti/omap/am335x-bonegreen.dtb \
    ti/omap/am335x-bonegreen-wireless.dtb \
    ti/omap/am335x-pocketbeagle.dtb \
    ti/omap/am335x-sancloud-bbe.dtb \
    ti/omap/am335x-sancloud-bbe-extended-wifi.dtb \
    ti/omap/am335x-sancloud-bbe-lite.dtb \
"

# BeagleBone camera cape overlays (kernel patches 0022/0023). The names are the cape EEPROM
# part number and version, so U-Boot's cape scanner loads <part>-<version>.dtbo from the same
# directory as the base DTB (the FAT root, via the DEVICETREE_FILES basenames in ti33x.inc).
# They cost nothing without a matching cape EEPROM and are never applied by FDTOVERLAYS.
#  - BB-BONE-CAM-VVDN-00A0: tested on a BeagleBone White only.
#  - BB-BONE-CAM3-01-00A2:  UNTESTED on hardware.
# Both disable the eMMC (it shares gpmc_csn1 and gpmc_ad0..7 with the cape): on a Black or
# Green with the cape fitted, boot from microSD with the rootfs on it. A board that keeps its
# rootfs on the eMMC must set disable_cape_overlays=BB-BONE-CAM-VVDN (or ...=BB-BONE-CAM3-01)
# in uboot.env, or remove the cape, or it will hang waiting for its root. Green Wireless is
# not supported. All cape scanning: cape_scan_off=1.
KERNEL_DEVICETREE += " \
    ti/omap/BB-BONE-CAM-VVDN-00A0.dtbo \
    ti/omap/BB-BONE-CAM3-01-00A2.dtbo \
"

IMAGE_FSTYPES:append = " tar.gz "

# Guesswork
SERIAL_CONSOLES = "115200;ttyS0"

UBOOT_MACHINE = "am335x_evm_config"

# and sdio
MACHINE_FEATURES = "kernel26 screen apm usbgadget usbhost vfat alsa"

# the kernel image needs to be in /boot
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-module-musb-dsps linux-firmware-rtl8723"
