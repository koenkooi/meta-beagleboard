#@TYPE: Machine
#@NAME: BeagleBoard-xM machine
#@DESCRIPTION: Machine configuration for the BeagleBoard-xM (DM3730), https://beagleboard.org/beagleboard-xm

require conf/machine/include/omap3.inc

KERNEL_DEVICETREE = " \
    ti/omap/omap3-beagle-xm.dtb \
    ti/omap/omap3-beagle-xm-ab.dtb \
    ti/omap/omap3-beagle-xm-ulcd7.dtb \
    ti/omap/omap3-beagle-xm-bbtoys-wifi.dtb \
    ti/omap/omap3-beagle-xm-ulcd7-bbtoys-wifi.dtb \
"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-beagleboard-xm"
UBOOT_MACHINE = "omap3_beagle_defconfig"

# UART3 is the console on the RS232 header, the old OE configs called it ttyO2
SERIAL_CONSOLES = "115200;ttyS2"

# Used by the wks for the kernel command line. U-Boot's own "console" variable is
# still ttyO2, which the old OMAP serial driver used, so console=${console} would
# name a tty that no longer exists
UBOOT_EXTLINUX_CONSOLE = "console=ttyS2,115200n8"

# Only has DVI connector for external screen
GUI_MACHINE_CLASS = "bigscreen"

MACHINE_FEATURES = "apm usbgadget usbhost vfat ext2 alsa screen"
