# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

LAYERDIR_meta-beagleboard := "${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-beagleboard"
BBFILE_PATTERN_meta-beagleboard := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-beagleboard = "8"

LAYERDEPENDS_meta-beagleboard = "core meta-ti-bsp"

LAYERSERIES_COMPAT_meta-beagleboard = "walnascar styhead blacksail"

# Recipes for layers we do not depend on; only parsed when that layer is present.
# This depth is not matched by the BBFILES glob above.
BBFILES_DYNAMIC += "multimedia-layer:${LAYERDIR}/recipes-multimedia/multimedia-layer/*/*.bbappend"
